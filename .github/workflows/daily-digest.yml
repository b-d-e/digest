name: Daily digest

on:
  # 06:00 UTC = 7am BST / 6am GMT.
  # This keeps the trigger at 06:00 UTC year-round.
  schedule:
    - cron: "0 6 * * *"

  # Lets you trigger a run manually from the Actions tab.
  workflow_dispatch:

# Allow the workflow to commit the new digest back to the repo.
permissions:
  contents: write

# Don't let two runs overlap.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate today's digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: uv run generate_digest.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily digest $(date -u +%Y-%m-%d)"
            git push
          fi
